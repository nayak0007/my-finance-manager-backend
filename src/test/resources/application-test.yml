spring:
  datasource:
    url: jdbc:h2:mem:myfinance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  auth:
    neon:
      # Overridden per test class: the integration test points this at a local JWKS endpoint
      # (see NeonAuthTestSupport). This value is only a fallback so the context can start; the
      # issuer and jwks-uri are derived from it.
      base-url: https://test-auth.invalid/testdb/auth
  openrouter:
    api-key:
    base-url: https://openrouter.ai/api/v1
    model: test/model
    timeout: PT5S
  rapidapi:
    api-key:
    host:
    url:
    file-field-name: file
    timeout: PT5S
  storage:
    location: ./target/test-uploads
  cors:
    allowed-origins: "*"

management:
  health:
    db:
      enabled: false

logging:
  level:
    # Surfaces why a token was rejected when an auth test fails.
    com.myfinancemanager.security: DEBUG
