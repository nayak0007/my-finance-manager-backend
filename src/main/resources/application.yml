server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: my-finance-manager-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myfinance}
    username: ${SPRING_DATASOURCE_USERNAME:myfinance}
    password: ${SPRING_DATASOURCE_PASSWORD:myfinance}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-please-override-in-production-1234567890}
    issuer: ${JWT_ISSUER:my-finance-manager}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    timeout: ${OPENROUTER_TIMEOUT:PT60S}
  rapidapi:
    api-key: ${RAPIDAPI_KEY:}
    host: ${RAPIDAPI_HOST:}
    url: ${RAPIDAPI_URL:}
    file-field-name: ${RAPIDAPI_FILE_FIELD_NAME:file}
    timeout: ${RAPIDAPI_TIMEOUT:PT90S}
  storage:
    location: ${STORAGE_LOCATION:./data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
