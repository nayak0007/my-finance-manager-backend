server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: my-finance-manager-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myfinance}
    username: ${SPRING_DATASOURCE_USERNAME:myfinance}
    password: ${SPRING_DATASOURCE_PASSWORD:myfinance}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  auth:
    neon:
      # Neon Auth (Managed Better Auth) owns credentials; this service only verifies its tokens.
      # Shape: https://<endpoint>.neonauth.<region>.aws.neon.tech/<database>/auth
      base-url: ${NEON_AUTH_URL:}
      # Derived from base-url when left blank. Set them only when the auth service is reached
      # through a different hostname than the one its iss/aud claims name.
      issuer: ${NEON_AUTH_ISSUER:}
      jwks-uri: ${NEON_AUTH_JWKS_URI:}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    timeout: ${OPENROUTER_TIMEOUT:PT60S}
  storage:
    location: ${STORAGE_LOCATION:./data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # INFO already logs every OpenRouter request/response summary (model, endpoint, timings,
    # token usage). DEBUG adds the full request body and the raw model response, which is what
    # to reach for when an import's parsed output looks wrong.
    com.myfinancemanager.integration.openrouter: ${OPENROUTER_LOG_LEVEL:INFO}
