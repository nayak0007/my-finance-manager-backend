version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myfinance-postgres
    environment:
      POSTGRES_DB: myfinance
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d myfinance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myfinance-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfinance-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myfinance
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/myfinance
      DB_POOL_SIZE: "10"
      NEON_AUTH_URL: ${NEON_AUTH_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8081,exp://192.168.*.*:8081"
      STORAGE_LOCATION: /app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myfinance-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: myfinance-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
    networks:
      - myfinance-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  myfinance-network:
    driver: bridge